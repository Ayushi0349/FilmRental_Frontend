<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Top 10 Actors by Film Count</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Top 10 Actors by Film Count</h1>

    <div class="mb-3">
        <a th:href="@{/actors}" class="btn btn-secondary">Back to Actors</a>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        <span th:text="${param.error}"></span>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Film Count</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="actor : ${topActors}">
            <td th:text="${actor[0]}"></td>
            <td th:text="${actor[1]}"></td>
            <td th:text="${actor[2]}"></td>
        </tr>
        <tr th:if="${topActors == null or topActors.empty}">
            <td colspan="3">No top actors found</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
