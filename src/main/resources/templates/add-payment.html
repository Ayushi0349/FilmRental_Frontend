<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        .error { color: #dc3545; }
        .container { margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4">Add Payment</h2>
    <div th:if="${error}" class="error mb-3" th:text="${error}"></div>

    <!-- Add Payment Form -->
    <form th:action="@{/payments/add}" th:object="${paymentDTO}" method="post" class="mb-4">
        <input type="hidden" name="page" th:value="${currentPage}"/>
        <input type="hidden" name="size" th:value="${pageSize}"/>
        <div class="mb-3">
            <label for="customerId" class="form-label">Customer ID:</label>
            <input type="number" id="customerId" th:field="*{customerId}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label for="staffId" class="form-label">Staff ID:</label>
            <input type="number" id="staffId" th:field="*{staffId}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label for="rentalId" class="form-label">Rental ID:</label>
            <input type="number" id="rentalId" th:field="*{rentalId}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label for="amount" class="form-label">Amount:</label>
            <input type="number" step="0.01" id="amount" th:field="*{amount}" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-primary">Add Payment</button>
        <a th:href="@{/payments(page=${currentPage}, size=${pageSize})}" class="btn btn-secondary ms-2">Back to Payments</a>
    </form>
</div>
</body>
</html>
