<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City List - Film Rental Store</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100 min-h-screen font-sans">
<div class="container mx-auto p-8">
    <!-- Header -->
    <header class="mb-8">
        <h1 class="text-5xl font-extrabold text-center text-indigo-800 drop-shadow-lg">City List</h1>
        <p class="text-center text-gray-600 mt-3 text-lg">Explore cities in the Film Rental Store database</p>
    </header>

    <!-- Error Message -->
    <div th:if="${error}" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
        <span th:text="${error}"></span>
    </div>

    <!-- Table Section -->
    <section th:if="${cities != null}" class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        <div class="overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-indigo-600 text-white">
                <tr>
                    <th class="py-4 px-6 text-left font-semibold uppercase tracking-wider">City ID</th>
                    <th class="py-4 px-6 text-left font-semibold uppercase tracking-wider">City Name</th>
                    <th class="py-4 px-6 text-left font-semibold uppercase tracking-wider">Country ID</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                <tr th:each="city : ${cities.content}" class="hover:bg-indigo-50 transition duration-200">
                    <td class="py-4 px-6 text-gray-700" th:text="${city.cityId}"></td>
                    <td class="py-4 px-6 text-gray-700" th:text="${city.city}"></td>
                    <td class="py-4 px-6 text-gray-700" th:text="${city.countryId}"></td>
                </tr>
                <tr th:if="${cities.content.isEmpty}">
                    <td colspan="3" class="py-4 px-6 text-center text-gray-500">No cities found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- Pagination Section -->
    <section th:if="${cities != null and !cities.content.isEmpty}" class="mt-6 flex justify-between items-center bg-gradient-to-r from-indigo-50 to-purple-50 p-5 rounded-2xl shadow-lg border border-gray-200">
        <!-- Items per page -->
        <div class="flex items-center space-x-3">
            <label for="size" class="text-gray-700 font-medium">Items per page</label>
            <select id="size" th:onchange="'window.location.href=\'/cities/list?page=' + ${currentPage} + '&size=' + this.value" class="border border-gray-300 rounded-lg px-3 py-1 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="10" th:selected="${pageSize == 10}">10</option>
                <option value="25" th:selected="${pageSize == 25}">25</option>
                <option value="50" th:selected="${pageSize == 50}">50</option>
                <option value="100" th:selected="${pageSize == 100}">100</option>
            </select>
            <span class="text-gray-700 font-medium" th:text="'1-' + ${cities.numberOfElements > 0 ? (cities.number * cities.size + cities.numberOfElements) : 0} + ' of ' + ${cities.totalElements} + ' items'"></span>
        </div>

        <!-- Pagination navigation -->
        <div class="flex items-center space-x-3">
            <a th:href="@{/cities/list(page=0,size=${pageSize})}" class="text-indigo-600 hover:text-indigo-800 font-medium" th:classappend="${currentPage == 0 ? 'pointer-events-none text-gray-400' : ''}">«</a>
            <a th:href="@{/cities/list(page=${currentPage - 1},size=${pageSize})}" class="text-indigo-600 hover:text-indigo-800 font-medium" th:classappend="${currentPage == 0 ? 'pointer-events-none text-gray-400' : ''}">Previous</a>
            <span class="text-gray-700 font-medium" th:text="${currentPage + 1} + ' of ' + ${cities.totalPages}"></span>
            <a th:href="@{/cities/list(page=${currentPage + 1},size=${pageSize})}" class="text-indigo-600 hover:text-indigo-800 font-medium" th:classappend="${currentPage == cities.totalPages - 1 ? 'pointer-events-none text-gray-400' : ''}">Next</a>
            <a th:href="@{/cities/list(page=${cities.totalPages - 1},size=${pageSize})}" class="text-indigo-600 hover:text-indigo-800 font-medium" th:classappend="${currentPage == cities.totalPages - 1 ? 'pointer-events-none text-gray-400' : ''}">»</a>
        </div>
    </section>

    <!-- Footer -->
    <footer class="mt-8 text-center text-gray-600">
        <p>© 2025 Film Rental Store. All rights reserved.</p>
    </footer>
</div>
</body>
</html>
