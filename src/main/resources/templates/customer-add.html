<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add Customer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1>Add New Customer</h1>

  <!-- Warning Message -->
  <div th:if="${warning}" class="alert alert-warning">
    <span th:text="${warning}"></span>
  </div>

  <!-- Add Customer Form -->
  <form th:action="@{/customers/add}" th:object="${customer}" method="post">
    <!-- Hidden fields for pagination -->
    <input type="hidden" name="page" th:value="${page}"/>
    <input type="hidden" name="size" th:value="${size}"/>

    <!-- First Name -->
    <div class="mb-3">
      <label for="firstName" class="form-label">First Name</label>
      <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
    </div>

    <!-- Last Name -->
    <div class="mb-3">
      <label for="lastName" class="form-label">Last Name</label>
      <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" th:field="*{email}" required>
    </div>

    <!-- Phone -->
    <div class="mb-3">
      <label for="phone" class="form-label">Phone Number</label>
      <input type="text" class="form-control" id="phone" th:field="*{phone}">
    </div>

    <!-- Store Dropdown -->
    <div class="mb-3">
      <label for="storeId" class="form-label">Store</label>
      <select class="form-control" id="storeId" th:field="*{storeId}">
        <option value="">Select a store</option>
        <option th:each="store : ${stores}"
                th:value="${store.storeId}"
                th:text="${store.storeName}">
        </option>
      </select>
      <small th:if="${stores == null or #lists.isEmpty(stores)}" class="text-muted">
        No stores available. You can add the customer without selecting a store.
      </small>
    </div>

    <!-- Address Dropdown -->
    <div class="mb-3">
      <label for="addressId" class="form-label">Address</label>
      <select class="form-control" id="addressId" th:field="*{addressId}">
        <option value="">Select an address</option>
        <option th:each="address : ${addresses}"
                th:value="${address.addressId}"
                th:text="${address.address + ', ' + address.city + ', ' + address.country}">
        </option>
      </select>
      <small th:if="${addresses == null or #lists.isEmpty(addresses)}" class="text-muted">
        No addresses available. You can add the customer without selecting an address.
      </small>
    </div>

    <!-- Active Status -->
    <div class="mb-3">
      <label for="active" class="form-label">Active</label>
      <select class="form-control" id="active" th:field="*{active}">
        <option th:value="true" th:text="'Yes'" th:selected="${customer.active == true}"></option>
        <option th:value="false" th:text="'No'" th:selected="${customer.active == false}"></option>
      </select>
    </div>

    <!-- Buttons -->
    <button type="submit" class="btn btn-primary">Add Customer</button>
    <a th:href="@{/customers(page=${page}, size=${size})}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
</body>
</html>
