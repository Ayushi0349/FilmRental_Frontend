<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Customer List</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    .pagination-wrapper {
      overflow-x: auto;
      white-space: nowrap;
    }
  </style>
</head>
<body class="p-4">

<h1>Customer List</h1>

<!-- Insert Customer Button -->
<a class="btn btn-success mb-3" th:href="@{/customers/add}">Insert New Customer</a>

<!-- Page Size Dropdown -->
<form method="get" th:action="@{/customers}" class="mb-3">
  <label for="size">Rows per page:</label>
  <select id="size" name="size" onchange="this.form.submit()">
    <option th:value="5" th:selected="${size == 5}">5</option>
    <option th:value="10" th:selected="${size == 10}">10</option>
    <option th:value="15" th:selected="${size == 15}">15</option>
    <option th:value="20" th:selected="${size == 20}">20</option>
    <option th:value="1000" th:selected="${size == 1000}">All</option>
  </select>
  <input type="hidden" name="page" th:value="${currentPage}" />
</form>

<!-- Customer Table -->
<table class="table table-bordered">
  <thead>
  <tr>
    <th>ID</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Email</th>
    <th>Active</th>
    <th>Create Date</th>
    <th>Action</th>
  </tr>
  </thead>
  <tbody>
  <tr th:if="${customers == null or #lists.isEmpty(customers)}">
    <td colspan="7">No customers found</td>
  </tr>
  <tr th:each="customer : ${customers}">
    <td th:text="${customer.customerId}"></td>
    <td th:text="${customer.firstName}"></td>
    <td th:text="${customer.lastName}"></td>
    <td th:text="${customer.email}"></td>
    <td th:text="${customer.active ? '1' : '0'}"></td>
    <td th:text="${customer.createDate}"></td>
    <td>
      <a th:href="@{'/customers/edit/' + ${customer.customerId}}" class="btn btn-sm btn-primary">Edit</a>
    </td>
  </tr>
  </tbody>
</table>

<!-- Pagination -->
<nav th:if="${totalPages > 1}">
  <ul class="pagination">

    <!-- Previous button -->
    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
      <a class="page-link" th:href="@{/customers(page=${currentPage - 1}, size=${size})}">Previous</a>
    </li>

    <!-- First page -->
    <li class="page-item" th:if="${currentPage > 2}">
      <a class="page-link" th:href="@{/customers(page=0, size=${size})}">1</a>
    </li>
    <li class="page-item disabled" th:if="${currentPage > 3}">
      <span class="page-link">...</span>
    </li>

    <!-- Dynamic middle pages (current - 2 to current + 2) -->
    <li class="page-item"
        th:each="i : ${#numbers.sequence((currentPage - 2 > 0 ? currentPage - 2 : 0), (currentPage + 2 < totalPages ? currentPage + 2 : totalPages - 1))}"
        th:classappend="${i == currentPage} ? 'active'">
      <a class="page-link" th:href="@{/customers(page=${i}, size=${size})}" th:text="${i + 1}"></a>
    </li>

    <!-- Last page -->
    <li class="page-item disabled" th:if="${currentPage < totalPages - 4}">
      <span class="page-link">...</span>
    </li>
    <li class="page-item" th:if="${currentPage < totalPages - 3}">
      <a class="page-link" th:href="@{/customers(page=${totalPages - 1}, size=${size})}" th:text="${totalPages}"></a>
    </li>

    <!-- Next button -->
    <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
      <a class="page-link" th:href="@{/customers(page=${currentPage + 1}, size=${size})}">Next</a>
    </li>

  </ul>
</nav>

</div>

</body>
</html>
