<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Customers with Due Rentals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1>Customers with Due Rentals for Store <span th:text="${storeId}"></span></h1>

  <div th:if="${param.error}" class="alert alert-danger">
    <span th:text="${param.error}"></span>
  </div>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>Customer ID</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="customer : ${customers}">
      <td th:text="${customer.customerId}"></td>
      <td th:text="${customer.firstName}"></td>
      <td th:text="${customer.lastName}"></td>
      <td th:text="${customer.email}"></td>
    </tr>
    <tr th:if="${customers == null or customers.isEmpty()}">
      <td colspan="4">No customers with due rentals found</td>
    </tr>
    </tbody>
  </table>

  <a href="/rentals" class="btn btn-secondary">Back to Rentals</a>
</div>
</body>
</html>
