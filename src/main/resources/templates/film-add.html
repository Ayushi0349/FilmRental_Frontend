<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Film</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Add New Film</h1>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>
    <div th:if="${warning}" class="alert alert-warning">
        <span th:text="${warning}"></span>
    </div>

    <form th:action="@{/films/add}" th:object="${film}" method="post">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" th:field="*{description}"></textarea>
        </div>
        <div class="mb-3">
            <label for="releaseYear" class="form-label">Release Year</label>
            <input type="number" class="form-control" id="releaseYear" th:field="*{releaseYear}" required min="1900" max="2099">
        </div>
        <div class="mb-3">
            <label for="rentalDuration" class="form-label">Rental Duration (days)</label>
            <input type="number" class="form-control" id="rentalDuration" th:field="*{rentalDuration}" required min="1">
        </div>
        <div class="mb-3">
            <label for="rentalRate" class="form-label">Rental Rate</label>
            <input type="number" step="0.01" class="form-control" id="rentalRate" th:field="*{rentalRate}" required min="0.01">
        </div>
        <div class="mb-3">
            <label for="replacementCost" class="form-label">Replacement Cost</label>
            <input type="number" step="0.01" class="form-control" id="replacementCost" th:field="*{replacementCost}" required min="0.01">
        </div>
        <div class="mb-3">
            <label for="languageId" class="form-label">Language</label>
            <select class="form-control" id="languageId" th:field="*{languageId}" required>
                <option value="">-- Select a Language --</option>
                <option th:each="language : ${languages}" th:value="${language.languageId}" th:text="${language.name}"></option>
            </select>
            <small th:if="${languages == null}" class="text-muted">Languages not available. Enter a valid language ID manually.</small>
        </div>
        <div class="mb-3">
            <label for="actorIds" class="form-label">Actors (Optional)</label>
            <select multiple class="form-control" id="actorIds" th:field="*{actorIds}">
                <option th:each="actor : ${actors}" th:value="${actor.actorId}" th:text="${actor.firstName} + ' ' + ${actor.lastName}"></option>
            </select>
            <small th:if="${actors == null}" class="text-muted">No actors available. You can add the film without selecting actors.</small>
        </div>
        <button type="submit" class="btn btn-primary">Add Film</button>
        <a href="/films" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
