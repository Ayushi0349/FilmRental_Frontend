<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Film</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Edit Film</h1>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/films/update/{id}(id=${film.filmId})}" th:object="${film}" method="post">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" th:field="*{description}"></textarea>
        </div>
        <div class="mb-3">
            <label for="releaseYear" class="form-label">Release Year</label>
            <input type="number" class="form-control" id="releaseYear" th:field="*{releaseYear}" required>
        </div>
        <div class="mb-3">
            <label for="rentalDuration" class="form-label">Rental Duration</label>
            <input type="number" class="form-control" id="rentalDuration" th:field="*{rentalDuration}" required>
        </div>
        <div class="mb-3">
            <label for="rentalRate" class="form-label">Rental Rate</label>
            <input type="number" step="0.01" class="form-control" id="rentalRate" th:field="*{rentalRate}" required>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/films" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
