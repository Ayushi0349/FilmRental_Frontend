<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Film List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1>Film List</h1>

  <div class="mb-3">
    <a th:href="@{/films/add}" class="btn btn-success">Insert New Film</a>
  </div>

  <div th:if="${param.success}" class="alert alert-success">
    <span th:text="${param.success}"></span>
  </div>
  <div th:if="${param.error}" class="alert alert-danger">
    <span th:text="${param.error}"></span>
  </div>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Description</th>
      <th>Release Year</th>
      <th>Rental Duration</th>
      <th>Rental Rate</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="film : ${films}">
      <td th:text="${film.filmId}"></td>
      <td th:text="${film.title}"></td>
      <td th:text="${film.description}"></td>
      <td th:text="${film.releaseYear}"></td>
      <td th:text="${film.rentalDuration}"></td>
      <td th:text="${film.rentalRate}"></td>
      <td>
        <a th:href="@{/films/edit/{id}(id=${film.filmId})}" class="btn btn-primary btn-sm">Edit</a>
      </td>
    </tr>
    <tr th:if="${films == null or films.empty}">
      <td colspan="7">No films found</td>
    </tr>
    </tbody>
  </table>

  <div th:if="${films != null and !films.empty}">
    <nav aria-label="Page navigation">
      <ul class="pagination justify-content-center">
        <!-- Previous Button -->
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link" th:href="@{/films(page=${currentPage - 1},size=${size})}">Previous</a>
        </li>

        <!-- First Page -->
        <li class="page-item" th:classappend="${currentPage == 0} ? 'active'">
          <a class="page-link" th:href="@{/films(page=0,size=${size})}" th:text="1"></a>
        </li>

        <!-- Ellipsis if currentPage > 3 -->
        <li class="page-item disabled" th:if="${currentPage > 3}">
          <span class="page-link">...</span>
        </li>

        <!-- Middle Pages (show 2 pages before and 2 after the current page, if possible) -->
        <th:block th:each="i : ${#numbers.sequence(currentPage - 2 > 1 ? currentPage - 2 : 1, currentPage + 2 < totalPages - 1 ? currentPage + 2 : totalPages - 1)}"
                  th:if="${i > 0 and i < totalPages - 1}">
          <li class="page-item" th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link" th:href="@{/films(page=${i},size=${size})}" th:text="${i + 1}"></a>
          </li>
        </th:block>

        <!-- Ellipsis if currentPage < totalPages - 4 -->
        <li class="page-item disabled" th:if="${currentPage < totalPages - 4}">
          <span class="page-link">...</span>
        </li>

        <!-- Last Page (if totalPages > 1) -->
        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'active'" th:if="${totalPages > 1}">
          <a class="page-link" th:href="@{/films(page=${totalPages - 1},size=${size})}" th:text="${totalPages}"></a>
        </li>

        <!-- Next Button -->
        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
          <a class="page-link" th:href="@{/films(page=${currentPage + 1},size=${size})}">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
</body>
</html>
