<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Film List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1>Film List</h1>

  <div class="mb-3">
    <a th:href="@{/films/add}" class="btn btn-success">Insert New Film</a>
  </div>

  <div th:if="${param.success}" class="alert alert-success">
    <span th:text="${param.success}"></span>
  </div>
  <div th:if="${param.error}" class="alert alert-danger">
    <span th:text="${param.error}"></span>
  </div>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Description</th>
      <th>Release Year</th>
      <th>Rental Duration</th>
      <th>Rental Rate</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="film : ${films}">
      <td th:text="${film.filmId}"></td>
      <td th:text="${film.title}"></td>
      <td th:text="${film.description}"></td>
      <td th:text="${film.releaseYear}"></td>
      <td th:text="${film.rentalDuration}"></td>
      <td th:text="${film.rentalRate}"></td>
      <td>
        <a th:href="@{/films/edit/{id}(id=${film.filmId})}" class="btn btn-primary btn-sm">Edit</a>
      </td>
    </tr>
    <tr th:if="${films == null or films.empty}">
      <td colspan="7">No films found</td>
    </tr>
    </tbody>
  </table>

  <div th:if="${films != null and !films.empty}">
    <nav aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link" th:href="@{/films(page=${currentPage - 1},size=10)}">Previous</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:classappend="${i == currentPage} ? 'active'">
          <a class="page-link" th:href="@{/films(page=${i},size=10)}" th:text="${i + 1}"></a>
        </li>
        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
          <a class="page-link" th:href="@{/films(page=${currentPage + 1},size=10)}">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
</body>
</html>
