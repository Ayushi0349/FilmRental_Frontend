<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Inventory List</h1>

    <div class="mb-3">
        <a th:href="@{/inventories/add}" class="btn btn-success">Insert New Inventory</a>
    </div>

    <div th:if="${param.success}" class="alert alert-success">
        <span th:text="${param.success}"></span>
    </div>
    <div th:if="${param.error}" class="alert alert-danger">
        <span th:text="${param.error}"></span>
    </div>



    <!-- Store ID Dropdown -->
    <div class="row mb-3">
        <div class="col-md-4">
            <label for="storeId" class="form-label">Select Store ID</label>
            <select id="storeId" class="form-select">
                <option value="">All Stores</option>
                <option th:each="storeId : ${storeIds}"
                        th:value="${storeId}"
                        th:text="${storeId}"></option>
            </select>
        </div>
    </div>

    <table class="table table-striped" id="inventoryTable">
        <thead>
        <tr>
            <th>Inventory ID</th>
            <th>Film ID</th>
            <th>Store ID</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inventory : ${inventories}"
            th:data-store-id="${inventory.storeId}">
            <td th:text="${inventory.inventoryId}"></td>
            <td th:text="${inventory.filmId}"></td>
            <td th:text="${inventory.storeId}"></td>
        </tr>
        <tr th:if="${inventories == null or #lists.isEmpty(inventories)}" class="no-data">
            <td colspan="3">No inventories found</td>
        </tr>
        </tbody>
    </table>

    <div th:if="${inventories != null and !#lists.isEmpty(inventories)}">
        <nav aria-label="Page navigation">
            <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/inventories(page=${currentPage - 1},size=10)}">Previous</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == 0} ? 'active' : ''">
                    <a class="page-link" th:href="@{/inventories(page=0,size=10)}">1</a>
                </li>
                <li class="page-item disabled" th:if="${currentPage > 3}">
                    <span class="page-link">...</span>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(currentPage - 2, currentPage + 2)}"
                    th:if="${i > 0 and i < totalPages - 1}"
                    th:classappend="${i == currentPage} ? 'active' : ''">
                    <a class="page-link" th:href="@{/inventories(page=${i},size=10)}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item disabled" th:if="${currentPage < totalPages - 4}">
                    <span class="page-link">...</span>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'active' : ''"
                    th:if="${totalPages > 1}">
                    <a class="page-link" th:href="@{/inventories(page=${totalPages - 1},size=10)}" th:text="${totalPages}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                    <a class="page-link" th:href="@{/inventories(page=${currentPage + 1},size=10)}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function() {
        $('#storeId').change(function() {
            var storeId = $(this).val();
            var $tableRows = $('#inventoryTable tbody tr:not(.no-data)');

            console.log('Selected Store ID:', storeId); // Debug

            // Show all rows if no storeId selected
            if (!storeId) {
                $tableRows.show();
                $('.no-data').hide();
                return;
            }

            // Filter rows by storeId
            var hasMatchingRows = false;
            $tableRows.each(function() {
                var rowStoreId = $(this).data('storeId');
                console.log('Row Store ID:', rowStoreId); // Debug
                if (rowStoreId == storeId) {
                    $(this).show();
                    hasMatchingRows = true;
                } else {
                    $(this).hide();
                }
            });

            // Show "No inventories found" if no matching rows
            $('.no-data').toggle(!hasMatchingRows);
        });
    });
</script>
</body>
</html>
