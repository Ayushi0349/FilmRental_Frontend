<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Team Member Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e8ecef; /* Slightly darker background */
            font-size: 18px; /* Increased base font size */
        }
        .container {
            max-width: 900px; /* Slightly wider container */
            width: 100%;
            padding: 25px; /* Increased padding */
        }
        .box {
            background-color: #ffffff;
            border-radius: 10px; /* Slightly larger border radius */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); /* Slightly larger shadow */
            padding: 35px; /* Increased padding */
            margin-bottom: 25px; /* Increased margin */
            text-align: center;
        }
        .box h2 {
            margin: 0 0 15px; /* Increased margin */
            color: #333;
            font-size: 2.2em; /* Larger heading */
        }
        .api-box {
            background-color: #f8f9fa;
            border-radius: 10px; /* Slightly larger border radius */
            padding: 25px; /* Increased padding */
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1); /* Slightly larger shadow */
        }
        .api-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0; /* Increased padding */
            border-bottom: 1px solid #dee2e6;
            font-size: 1.2em; /* Larger font size */
        }
        .api-item:last-child {
            border-bottom: none;
        }
        .api-item span {
            font-size: 1.2em; /* Larger font size */
            color: #333;
        }
        .edit-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px; /* Increased padding */
            border-radius: 5px; /* Slightly larger border radius */
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 1.1em; /* Larger font size */
        }
        .edit-button:hover {
            background-color: #0056b3;
        }
        .pagination {
            margin-top: 25px; /* Increased margin */
            display: flex;
            justify-content: center;
            gap: 12px; /* Increased gap */
        }
        .pagination a {
            text-decoration: none;
            padding: 10px 15px; /* Increased padding */
            border: 1px solid #dee2e6;
            border-radius: 5px; /* Slightly larger border radius */
            color: #007bff;
            font-size: 1.1em; /* Larger font size */
        }
        .pagination a:hover {
            background-color: #f8f9fa;
        }
        .pagination a.disabled {
            color: #6c757d;
            pointer-events: none;
        }
        .pagination a.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px; /* Increased margin */
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            font-size: 1.2em; /* Larger font size */
        }
        .back-link:hover {
            color: #0056b3;
        }
        .error {
            color: #ff0000;
            font-weight: bold;
            font-size: 1.2em; /* Larger font size */
            margin-bottom: 15px; /* Increased margin */
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box" th:if="${member != null}">
        <h2 th:text="${member.name}"></h2>
        <div class="api-box">
            <h3>API Endpoints</h3>
            <div th:if="${error != null}" class="error" th:text="${error}"></div>
            <div class="api-item" th:each="endpoint : ${endpoints}">
                <span th:text="${endpoint}"></span>
                <a th:href="@{/${member.id == 1 ? 'actors' : member.id == 2 ? 'films' : member.id == 3 ? 'inventory' : member.id == 4 ? 'payment' : member.id == 5 ? 'rental' : member.id == 6 ? 'staff' : member.id == 7 ? 'store' : 'categories'}/edit/{endpoint}(endpoint=${endpoint},id=${member.id},page=${currentPage},size=${pageSize})}" class="edit-button">Edit</a>
            </div>
            <div th:if="${#lists.isEmpty(endpoints) and error == null}">
                <p>No API endpoints available.</p>
            </div>
            <div class="pagination" th:if="${totalEndpoints > pageSize}">
                <a th:href="@{/${member.id == 1 ? 'actors' : member.id == 2 ? 'films' : member.id == 3 ? 'inventory' : member.id == 4 ? 'payment' : member.id == 5 ? 'rental' : member.id == 6 ? 'staff' : member.id == 7 ? 'store' : 'categories'}/details/{id}(id=${member.id},page=${currentPage - 1},size=${pageSize})}"
                   th:class="${currentPage == 0} ? 'disabled' : ''">Previous</a>
                <th:block th:each="i : ${#numbers.sequence(0, (totalEndpoints - 1) / pageSize)}">
                    <a th:href="@{/${member.id == 1 ? 'actors' : member.id == 2 ? 'films' : member.id == 3 ? 'inventory' : member.id == 4 ? 'payment' : member.id == 5 ? 'rental' : member.id == 6 ? 'staff' : member.id == 7 ? 'store' : 'categories'}/details/{id}(id=${member.id},page=${i},size=${pageSize})}"
                       th:class="${currentPage == i} ? 'active' : ''" th:text="${i + 1}"></a>
                </th:block>
                <a th:href="@{/${member.id == 1 ? 'actors' : member.id == 2 ? 'films' : member.id == 3 ? 'inventory' : member.id == 4 ? 'payment' : member.id == 5 ? 'rental' : member.id == 6 ? 'staff' : member.id == 7 ? 'store' : 'categories'}/details/{id}(id=${member.id},page=${currentPage + 1},size=${pageSize})}"
                   th:class="${(currentPage + 1) * pageSize >= totalEndpoints} ? 'disabled' : ''">Next</a>
            </div>
        </div>
        <a class="back-link" href="/">Back to Team</a>
    </div>
    <div class="box" th:if="${member == null}">
        <p class="error">Team member not found.</p>
        <a class="back-link" href="/">Back to Team</a>
    </div>
</div>
</body>
</html>
