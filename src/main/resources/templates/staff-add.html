<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function validateForm() {
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const addressId = document.getElementById('addressId').value;
            const storeId = document.getElementById('storeId').value;
            const emailRegex = /^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$/;

            if (!firstName.trim()) {
                alert('First name cannot be empty');
                return false;
            }
            if (!lastName.trim()) {
                alert('Last name cannot be empty');
                return false;
            }
            if (!email.trim()) {
                alert('Email cannot be empty');
                return false;
            }
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address');
                return false;
            }
            if (!addressId || isNaN(addressId) || addressId <= 0) {
                alert('Please enter a valid Address ID');
                return false;
            }
            if (!storeId || isNaN(storeId) || storeId <= 0) {
                alert('Please enter a valid Store ID');
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
<div class="container mt-5">
    <h1>Add New Staff</h1>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/staff/add}" th:object="${staff}" method="post" onsubmit="return validateForm()">
        <div class="mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" th:field="*{firstName}" required>
        </div>
        <div class="mb-3">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" th:field="*{lastName}" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" required>
        </div>
        <div class="mb-3">
            <label for="addressId" class="form-label">Address ID</label>
            <input type="number" class="form-control" id="addressId" th:field="*{addressId}" required min="1">
        </div>
        <div class="mb-3">
            <label for="storeId" class="form-label">Store ID</label>
            <input type="number" class="form-control" id="storeId" th:field="*{storeId}" required min="1">
        </div>
        <div class="mb-3">
            <label for="active" class="form-label">Active</label>
            <select class="form-control" id="active" th:field="*{active}" required>
                <option th:value="true" th:text="Yes"></option>
                <option th:value="false" th:text="No"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Add Staff</button>
        <a href="/staff" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
