<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Staff List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h1>Staff List</h1>

  <div class="mb-3">
    <a th:href="@{/staff/add}" class="btn btn-success">Insert New Staff</a>
  </div>

  <div th:if="${param.success}" class="alert alert-success">
    <span th:text="${param.success}"></span>
  </div>
  <div th:if="${param.error}" class="alert alert-danger">
    <span th:text="${param.error}"></span>
  </div>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Active</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="staff : ${staff}">
      <td th:text="${staff.staffId}"></td>
      <td th:text="${staff.firstName}"></td>
      <td th:text="${staff.lastName}"></td>
      <td th:text="${staff.email}"></td>
      <td th:text="${staff.active}"></td>
      <td>
        <a th:href="@{/staff/edit/{id}(id=${staff.staffId})}" class="btn btn-primary btn-sm">Edit</a>
      </td>
    </tr>
    <tr th:if="${staff == null or staff.empty}">
      <td colspan="6">No staff found</td>
    </tr>
    </tbody>
  </table>

  <div th:if="${staff != null and !staff.empty}">
    <nav aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link" th:href="@{/staff(page=${currentPage - 1},size=10)}">Previous</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            th:classappend="${i == currentPage} ? 'active'">
          <a class="page-link" th:href="@{/staff(page=${i},size=10)}" th:text="${i + 1}"></a>
        </li>
        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
          <a class="page-link" th:href="@{/staff(page=${currentPage + 1},size=10)}">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
</body>
</html>
